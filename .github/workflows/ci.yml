name: Phase 0 validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salon_user
          POSTGRES_PASSWORD: salon_password_dev
          POSTGRES_DB: salon_saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon_user -d salon_saas_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: development
      APP_NAME: Salon SaaS Platform
      DATABASE_URL: postgresql+psycopg://salon_user:salon_password_dev@localhost:5432/salon_saas_dev
      REDIS_URL: redis://localhost:6379/0
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
